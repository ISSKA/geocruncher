version: "3"
services:
  api:
    image: geocruncher/geocruncher-dev:latest
    depends_on:
      - redis
    command: ["bash", "/home/build/scripts/api.sh"]
    ports:
      - "5001:5000"
    volumes:
      - model-artifacts:/home/build/geocruncher/profiler/artifacts
    environment:
      - REDIS_HOST=redis
    logging:
      driver: "journald"
      options:
        tag: "geocruncher.dev"
        labels: "api"
  trainer:
    image: geocruncher/geocruncher-local:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: local
    depends_on:
      - redis
    command: ["bash", "-lc", "uv run python -m geocruncher.profiler.train_model"]
    volumes:
      - $PWD:/home/build
    environment:
      - REDIS_HOST=redis
  worker:
    image: geocruncher/geocruncher-dev:latest
    depends_on:
      - redis
    command: ["bash", "/home/build/scripts/worker.sh"]
    environment:
      - REDIS_HOST=redis
      - PROFILING_ENABLED=true
    logging:
      driver: "journald"
      options:
        tag: "geocruncher.dev"
        labels: "worker"
  redis:
    image: redis:8.2
    volumes:
      - /root/data/web-ci/var/lib/redis:/data
    restart: unless-stopped
    ports:
      - "6380:6379"
    logging:
      driver: "journald"
      options:
        tag: "geocruncher.dev"
        labels: "redis"

