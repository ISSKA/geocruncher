version: "3"
services:
  api:
    image: geocruncher/geocruncher-prod:latest
    depends_on:
      - redis
    command: ["bash", "/home/build/scripts/api.sh"]
    ports:
      - "5000:5000"
    volumes:
      - model-artifacts:/home/build/geocruncher/profiler/artifacts
    environment:
      - REDIS_HOST=redis
    logging:
      driver: "journald"
      options:
        tag: "geocruncher.prod"
        labels: "api"
  trainer:
    image: geocruncher/geocruncher-prod:latest
    depends_on:
      - redis
    command: ["bash", "-lc", "uv run --no-sync python -m geocruncher.profiler.train_model"]
    environment:
      - REDIS_HOST=redis
    volumes:
      - model-artifacts:/home/build/geocruncher/profiler/artifacts
    logging:
      driver: "journald"
      options:
        tag: "geocruncher.prod"
        labels: "trainer"
  worker:
    image: geocruncher/geocruncher-prod:latest
    depends_on:
      - redis
    command: ["bash", "/home/build/scripts/worker.sh"]
    environment:
      - REDIS_HOST=redis
      - PROFILING_ENABLED=true
    logging:
      driver: "journald"
      options:
        tag: "geocruncher.prod"
        labels: "worker"
  redis:
    image: redis:8.2
    volumes:
      - /root/data/web-prod/var/lib/redis:/data
    restart: unless-stopped
    ports:
      - "6379:6379"
    logging:
      driver: "journald"
      options:
        tag: "geocruncher.prod"
        labels: "redis"

volumes:
  model-artifacts:
